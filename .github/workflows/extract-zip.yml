name: Extract ZIP

on:
  push:
    paths:
      - 'taste-skill-main.zip'
      - '.github/workflows/extract-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf /tmp/taste-extract
          mkdir -p /tmp/taste-extract
          unzip -q taste-skill-main.zip -d /tmp/taste-extract

          if [ -d /tmp/taste-extract/taste-skill-main ]; then
            cp -a /tmp/taste-extract/taste-skill-main/. .
          else
            cp -a /tmp/taste-extract/. .
          fi

      - name: Remove temporary workflow
        run: rm -f .github/workflows/extract-zip.yml

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract taste-skill-main.zip"
          git push
